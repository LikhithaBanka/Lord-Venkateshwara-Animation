<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Venkateshwara Reveal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Full-screen blurred background -->
    <div id="blurBackground">
        <img src="venkateswara.jpg" alt="">
    </div>


    <!-- Particle animation -->
    <canvas id="canvas"></canvas>


    <!-- Final image -->
    <div id="finalImage">

        <img
            src="venkateswara.jpg"
            alt="Lord Venkateshwara"
        >

    </div>


    <!-- Flash -->
    <div id="flash"></div>


    <!-- ==========================================
         GOVINDHA SOUND
         ========================================== -->

    <audio
        id="bgMusic"
        preload="auto"
    >

        <source
            src="./govindha sound.mpeg"
            type="audio/mpeg"
        >

    </audio>


    <script src="script.js"></script>

</body>

</html>
